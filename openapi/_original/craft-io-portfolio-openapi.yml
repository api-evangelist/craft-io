openapi: 3.0.0
info:
  title: Craft.io Portfolio API
  description: REST API providing access to portfolio data including portfolio items,
    portfolio custom fields, and terminology for enterprise product portfolio management.
  version: 1.0.0
  contact:
    name: Craft.io Support
    url: https://help.craft.io/
    email: support@craft.io
servers:
- url: /
paths:
  /portfolios/{accountId}:
    get:
      operationId: GetPortfolios
      responses:
        '200':
          description: A list of portfolios
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Portfolio'
                type: array
              examples:
                Example 1:
                  value:
                  - id: string
                    name: string
                    workspaces:
                    - id: string
                      name: string
                      key: string
        '400':
          description: Invalid account ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching portfolios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of your account’s portfolios and the workspaces they
        are connected with
      tags:
      - Portfolios
      security:
      - api_key:
        - read:portfolios:craft
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
  /portfolio/{portfolioId}/portfolio_fields:
    get:
      operationId: GetPortfolioCustomFields
      responses:
        '200':
          description: A list of portfolio fields and their metadata
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomField'
                type: array
        '400':
          description: Invalid portfolio ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching portfolio fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of portfolio fields and their metadata
      tags:
      - Portfolios
      security:
      - api_key:
        - read:portfolios:craft
      parameters:
      - in: path
        name: portfolioId
        required: true
        schema:
          type: string
  /portfolio/{portfolioId}/terminology:
    get:
      operationId: GetPortfolioTerminology
      responses:
        '200':
          description: A list of portfolio entities terminology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminologyList_Terminology_'
        '400':
          description: Invalid portfolio ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching terminology
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of the portfolio entities terminology
      tags:
      - Portfolios
      security:
      - api_key:
        - read:portfolios:craft
      parameters:
      - in: path
        name: portfolioId
        required: true
        schema:
          type: string
