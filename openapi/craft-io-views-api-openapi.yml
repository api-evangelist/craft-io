        name:
          type: string
        viewType:
          type: string
        ownerType:
          type: string
          enum:
          - personal
          - workspace
        category:
          type: string
        workspaceId:
          type: string
        portfolioId:
          type: string
        webUrl:
          type: string
        controllers:
          $ref: '#/components/schemas/ViewControllers'
        columns:
          items:
            type: string
          type: array
        layout:
          items:
            type: string
          type: array
        compactMode:
          type: string
          description: 'Card density on a card-based view: `compact` or `default`.'
        filters:
          $ref: '#/components/schemas/Record_string.unknown_'
        listItemsParams:
          $ref: '#/components/schemas/Record_string.string_'
          description: Pass straight to the tool named by `listItemsTool` to get the view's items.
        listItemsTool:
          type: string
          enum:
          - list_items
          - list_portfolio_items
          - list_feedback_items
          description: 'Which list tool `listItemsParams` belongs to. Feedback views are the reason

            this is stated rather than assumed — their items are not work items.'
        unsupportedFilters:
          items:
            $ref: '#/components/schemas/UnsupportedFilter'
          type: array
          description: Filters the list endpoints cannot reproduce — the result will be wider.
        columnColors:
