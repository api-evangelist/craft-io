          description: Grouping axis. Not available on timeline views.
        swimLanesBy:
          type: string
          description: Swim-lane axis. Timeline and swimlanes views only.
      type: object
      additionalProperties: false
    ViewLookupResponse:
      description: 'A name lookup resolves to one view, or reports every candidate so the caller

        can narrow by ownerType / category. Two views may share a name — the id is

        the identity, the name is a convenience.'
      properties:
