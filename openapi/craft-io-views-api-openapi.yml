              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
      description: Change a portfolio view's filters, controllers, name or category.
      tags:
      - Views
      security:
      - api_key:
        - write:portfolios:craft
        - read:portfolios:craft
      parameters:
      - in: path
        name: portfolioId
        required: true
