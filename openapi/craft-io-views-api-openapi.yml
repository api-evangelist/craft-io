          description: 'Per-column colours, keyed the same way `columns` is. Absent when the view

            has none.'
        raw:
          $ref: '#/components/schemas/WireView'
          description: 'Only when includeRaw was asked for: the full stored state.'
      required:
      - viewId
      - name
      - viewType
      - ownerType
      - controllers
      - filters
      - listItemsParams
      - listItemsTool
      type: object
      additionalProperties: false
    UnsupportedFilter:
