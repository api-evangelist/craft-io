openapi: 3.2.0
info:
  title: Craft.io Public Views API
  version: 1.0.0
  description: 'Our platform provides a set of comprehensive public APIs that allows users and applications to access and retrieve data about working items within our system.


    With our API, users can easily integrate item information into their own applications, such as dashboards or organizational tools for customer service, sales, and marketing.


    Our API supports a variety of data formats and retrieval methods, making it easy to customize and integrate with your existing systems. Whether you''re looking to build custom reports, track inventory, or monitor sales trends, our API provides the flexibility and scalability you need to get the job done.


    For getting an API key just approach our support team at support@craft.io or on the app chat (‘contact support’).'
  license:
    name: Terms and conditions
    url: https://craft.io/terms-and-conditions/
servers:
- url: /
tags:
- name: Views
paths:
  /workspace/{workspaceId}/views:
    get:
      operationId: ListWorkspaceViews
      responses:
        '200':
          description: The workspace views
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewListResponse'
        '400':
          description: Invalid workspace ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: List the workspace's views and the categories they are organised by.
      tags:
      - Views
      security:
      - api_key:
        - read:workspace-meta:craft
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - description: Only views in this category (exact name, case-insensitive).
        in: query
        name: category
        required: false
        schema:
          type: string
      - description: '`personal` or `workspace`.'
        in: query
        name: ownerType
        required: false
        schema:
          type: string
          enum:
          - personal
          - workspace
      - description: Only views whose name contains this text (case-insensitive).
        in: query
        name: name
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          format: double
          type: number
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          format: double
          type: number
      summary: List workspace views
      x-summary-source: derived
    post:
      operationId: CreateWorkspaceView
      responses:
        '200':
          description: The created view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewDetail'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '422':
          description: Invalid view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
      description: Create a workspace or personal view and return a link that opens it.
      tags:
      - Views
      security:
      - api_key:
        - write:items:craft
        - read:workspace-meta:craft
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreateBody'
      summary: Create workspace view
      x-summary-source: derived
  /workspace/{workspaceId}/views/{viewId}:
    get:
      operationId: GetWorkspaceView
      responses:
        '200':
          description: The view configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewDetail'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '404':
          description: No view found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: A single view's full configuration, by its id.
      tags:
      - Views
      security:
      - api_key:
        - read:workspace-meta:craft
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: viewId
        required: true
        schema:
          type: string
      - description: Also return the stored state verbatim.
        in: query
        name: includeRaw
        required: false
        schema:
          default: false
          type: boolean
      - description: Include released items in listItemsParams. A view with no status filter hides them, so they are excluded by default to match what the view shows.
        in: query
        name: includeCompleted
        required: false
        schema:
          default: false
          type: boolean
      summary: Get workspace view
      x-summary-source: derived
    patch:
      operationId: UpdateWorkspaceView
      responses:
        '200':
          description: The updated view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewDetail'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '404':
          description: No view found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '422':
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
      description: Change a view's filters, controllers, name or category.
      tags:
      - Views
      security:
      - api_key:
        - write:items:craft
        - read:workspace-meta:craft
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: viewId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewUpdateBody'
      summary: Update workspace view
      x-summary-source: derived
    delete:
      operationId: DeleteWorkspaceView
      responses:
        '200':
          description: The view is deleted
          content:
            application/json:
              schema:
                properties:
                  viewId:
                    type: string
                  deleted:
                    type: boolean
                required:
                - viewId
                - deleted
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '404':
          description: No view found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: 'Delete a view.


        The owner/admin rule (a workspace view needs admin rights, a personal view

        only its owner) is enforced by the views service itself, which holds the

        ownerType and personId — checking here as well would cost an extra fetch to

        re-derive what it already knows. Its 403 is relayed verbatim.'
      tags:
      - Views
      security:
      - api_key:
        - delete:items:craft
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - in: path
        name: viewId
        required: true
        schema:
          type: string
      summary: Delete workspace view
      x-summary-source: derived
  /workspace/{workspaceId}/view:
    get:
      operationId: FindWorkspaceView
      responses:
        '200':
          description: The view, or the candidates to choose between
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewLookupResponse'
        '404':
          description: No view with that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: 'Resolve a view by name. Returns the view, or every candidate when the name

        is not unique in the container.'
      tags:
      - Views
      security:
      - api_key:
        - read:workspace-meta:craft
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - description: Exact view name (case-insensitive).
        in: query
        name: name
        required: true
        schema:
          type: string
      - description: Narrow to `personal` or `workspace`.
        in: query
        name: ownerType
        required: false
        schema:
          type: string
          enum:
          - personal
          - workspace
      - description: Narrow to a category name.
        in: query
        name: category
        required: false
        schema:
          type: string
      - description: Also return the stored state verbatim.
        in: query
        name: includeRaw
        required: false
        schema:
          default: false
          type: boolean
      - description: Include released items in listItemsParams. A view with no status filter hides them, so they are excluded by default to match what the view shows.
        in: query
        name: includeCompleted
        required: false
        schema:
          default: false
          type: boolean
      summary: Find workspace view
      x-summary-source: derived
  /portfolio/{portfolioId}/views:
    get:
      operationId: ListPortfolioViews
      responses:
        '200':
          description: The portfolio views
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewListResponse'
        '400':
          description: Invalid portfolio ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: List the portfolio's views and the categories they are organised by.
      tags:
      - Views
      security:
      - api_key:
        - read:portfolios:craft
      parameters:
      - in: path
        name: portfolioId
        required: true
        schema:
          type: string
      - description: Only views in this category (exact name, case-insensitive).
        in: query
        name: category
        required: false
        schema:
          type: string
      - description: '`personal` or `workspace`.'
        in: query
        name: ownerType
        required: false
        schema:
          type: string
          enum:
          - personal
          - workspace
      - description: Only views whose name contains this text (case-insensitive).
        in: query
        name: name
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          format: double
          type: number
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          format: double
          type: number
      summary: List portfolio views
      x-summary-source: derived
    post:
      operationId: CreatePortfolioView
      responses:
        '200':
          description: The created view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewDetail'
        '422':
          description: Invalid view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
      description: Create a portfolio view and return a link that opens it.
      tags:
      - Views
      security:
      - api_key:
        - write:portfolios:craft
        - read:portfolios:craft
      parameters:
      - in: path
        name: portfolioId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewCreateBody'
      summary: Create portfolio view
      x-summary-source: derived
  /portfolio/{portfolioId}/views/{viewId}:
    get:
      operationId: GetPortfolioView
      responses:
