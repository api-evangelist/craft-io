openapi: 3.2.0
info:
  title: Craft.io Public Work Items and OKRs API
  version: 1.0.0
  description: 'Our platform provides a set of comprehensive public APIs that allows users and applications to access and retrieve data about working items within our system.


    With our API, users can easily integrate item information into their own applications, such as dashboards or organizational tools for customer service, sales, and marketing.


    Our API supports a variety of data formats and retrieval methods, making it easy to customize and integrate with your existing systems. Whether you''re looking to build custom reports, track inventory, or monitor sales trends, our API provides the flexibility and scalability you need to get the job done.


    For getting an API key just approach our support team at support@craft.io or on the app chat (‘contact support’).'
  license:
    name: Terms and conditions
    url: https://craft.io/terms-and-conditions/
servers:
- url: /
tags:
- name: Work Items and OKRs
  description: 'Work items are the main building blocks of your product’s roadmap, and include Products, Epics, Features and Sub Features.

    OKRs are the goal-setting framework of your product’s roadmap, and include Objectives and Key Results.'
paths:
  /item/{itemId}:
    get:
      operationId: GetItem
      responses:
        '200':
          description: The item’s metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '404':
          description: No item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '422':
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: An error occurred while fetching item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get a specific work item metadata by its ID
      tags:
      - Work Items and OKRs
      security:
      - api_key:
        - read:items:craft
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: string
      - description: Comma separated field list to be included in response, set "all" for all fields
        in: query
        name: fields
        required: false
        schema:
          type: string
      summary: Get item
      x-summary-source: derived
    delete:
      operationId: DeleteItem
      responses:
        '200':
          description: The item’s metadata
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                required:
                - message
                type: object
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '404':
          description: No workspace found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '422':
          description: Invalid item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: An error occurred while creating item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Delete a work item
      tags:
      - Work Items and OKRs
      security:
      - api_key:
        - delete:items:craft
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: string
      summary: Delete item
      x-summary-source: derived
  /item/{itemId}/flat:
    get:
      operationId: GetItemFlat
      responses:
        '200':
          description: The item’s metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemFlat'
              examples:
                Example 1:
                  value:
                    id: string
                    type: string
                    workspaceId: string
                    title: string
                    description: string
                    creationTime: '2022-09-16T06:26:01.000Z'
                    updateTime: '2023-06-14T13:54:34.792Z'
                    status_id: string
                    status_name: string
                    importance_id: string
                    importance_name: string
                    objective_id: string
                    objective_name: string
                    keyResult_id: string
                    keyResult_name: string
                    persona_id: string
                    persona_name: string
                    sprint_id: string
                    sprint_name: string
                    quarter_id: string
                    release_name: string
                    assignee_id: string
                    assignee_team: string
                    assignee_user: string
                    storyPoints: 0
                    estimatedHours: 0
                    actualStartDate: '2023-06-06T06:56:35.000Z'
                    actualEndDate: '2023-06-20T06:56:35.000Z'
                    devToolKey:
                      jira: string
                      ado: string
                      github: string
                      gitlab: string
                      pivotaltracker: string
                      targetprocess: string
                    parent_id: string
                    parent_title: string
                    parent_shortId: string
                    custom_2305843010172190992: string
                    custom_2305843010172191018: string
                    custom_2305843010172191132: string
                    custom_2305843010172191024: string
                    custom_2305843010172191022: string
                    custom_2305843010172191016: '2023-06-20T21:00:00.000Z'
                    custom_2305843010172171351: string
                    custom_2305843010172171349: string
                    custom_2305843010172171347: string
                    custom_2305843010172190959:
                    - string
                    labels:
                    - string
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '404':
          description: No item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '422':
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: An error occurred while fetching item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get a specific work item metadata by its ID (flattened format)
      tags:
      - Work Items and OKRs
      security:
      - api_key:
        - read:items:craft
      parameters:
      - in: path
        name: itemId
        required: true
        schema:
          type: string
      - description: Comma separated field list to be included in response, set "all" for all fields
        in: query
        name: fields
        required: false
        schema:
          type: string
      summary: Get item flat
      x-summary-source: derived
  /workspace/{workspaceId}/items:
    get:
      operationId: GetItems
      responses:
        '200':
          description: List of workspace items, OKRs and their metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsPaginated_Item_'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '422':
          description: Invalid workspace ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateErrorJSON'
        '500':
          description: An error occurred while fetching item list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get all workspace working items and OKRs metadata by the workspace ID
      tags:
      - Work Items and OKRs
      security:
      - api_key:
        - read:items:craft
      parameters:
      - in: path
        name: workspaceId
        required: true
        schema:
          type: string
      - description: Comma separated field list to be included in response, set "all" for all fields
        in: query
        name: fields
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          format: double
          type: number
      - description: Items per page (1-500).
        in: query
        name: limit
        required: false
        schema:
          default: 50
          format: double
          type: number
      - description: Get list of items whose `updateTime` is at or after this date (e.g. 2023-08-09T12:33:18.615Z ). Matches the `updateTime` field this endpoint returns, so the largest one you have seen can be passed straight back as an incremental-sync cursor.
        in: query
        name: updated_from
        required: false
        schema:
          format: date-time
          type: string
      - description: Get list of items whose `updateTime` is before this date (e.g. 2023-09-09T23:22:10.531Z )
        in: query
        name: updated_to
        required: false
        schema:
          format: date-time
          type: string
      - description: 'Filter by item type, comma separated. Accepts canonical type names (see the 422 error for the full list) and this workspace''s type labels. A canonical name ALWAYS wins over a label that collides with it, and Craft''s stock labels do collide: "Story" is the default label of canonical `feature` and "Initiative" of canonical `keyresult`, so `type=story` means canonical `story` (labelled "Subtask") rather than the type displayed as "Story". Filter by the `typeKey` a read returns, not the `type` label, to be unambiguous.'
        in: query
        name: type
        required: false
        schema:
          type: string
      - description: Filter by parent/ancestor IDs (comma separated). MUST be internal numeric IDs (e.g. `2305843010635321210`), NOT shortIds like `CRK-25832` — the SQL casts to `::bigint[]`, so a shortId yields zero matches (200 with an empty list, no error). To resolve a shortId first, call the same list endpoint with `?shortId=<KEY-N>` to get the numeric id.
        in: query
        name: parents
        required: false
        schema:
          type: string
      - in: query
        name: parentId
        required: false
        schema:
          type: string
      - description: Case-insensitive substring search over title + description + linked dev-tool issue keys (e.g. a Jira key like PROJ-123) + attachment metadata. Min 2 chars; shorter values are ignored.
        in: query
        name: keyword
        required: false
        schema:
          type: string
      - description: Exact match on textual short id (e.g. `CRK-20091`). When supplied, takes precedence over `keyword` and resolves via the `(ct_craft_product__id, short_id)` unique index — sub-millisecond, returns at most one item.
        in: query
        name: shortId
        required: false
        schema:
          type: string
      - description: 'Exact match on a linked dev-tool issue key — Jira, Azure DevOps, or another connected integration (e.g. `EP-402`). Strongly consistent: resolves against the link tables'' key unique indexes, so it finds every linked item — unlike `keyword`, which only carries a dev key after the item''s title/description is edited *after* linking and therefore misses linked-but-unedited items. Case-sensitive (keys are stored upper-case). Combines with other filters (status, type, …).'
        in: query
        name: devToolKey
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: importance
        required: false
        schema:
          type: string
      - in: query
        name: assignee
        required: false
        schema:
          type: string
      - in: query
        name: sprint
        required: false
        schema:
          type: string
      - in: query
        name: quarter
        required: false
        schema:
          type: string
      - in: query
        name: labels
        required: false
        schema:
          type: string
      - in: query
        name: createdBy
        required: false
        schema:
          type: string
      - in: query
        name: created_from
        required: false
        schema:
          format: date-time
          type: string
      - in: query
        name: created_to
        required: false
        schema:
          format: date-time
          type: string
      - in: query
        name: customFields
        required: false
        schema:
          type: string
      summary: Get items
      x-summary-source: derived
