openapi: 3.0.0
info:
  title: Craft.io Feedback Portal API
  description: REST API for managing customer feedback portals, including listing
    portals and categories, retrieving feedback items, and submitting new feedback
    via POST requests.
  version: 1.0.0
  contact:
    name: Craft.io Support
    url: https://help.craft.io/
    email: support@craft.io
servers:
- url: /
paths:
  /feedback_portals/{accountId}:
    get:
      operationId: GetPortals
      responses:
        '200':
          description: A list of feedback portals
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeedbackPortal'
                type: array
              examples:
                Example 1:
                  value:
                  - id: '2305843010022720311'
                    name: My Favorite portal
                    url: myportal
                  - id: '2305843010022720322'
                    name: Secret portal
                    url: secretportal
        '400':
          description: Invalid account ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching feedback portals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of your account’s feedback portals
      tags:
      - Feedback Portals
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - in: path
        name: accountId
        required: true
        schema:
          type: string
  /feedback_portals:
    get:
      operationId: GetPortalsExtended
      responses:
        '200':
          description: A list of feedback portals
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeedbackPortal'
                type: array
              examples:
                Example 1:
                  value:
                  - id: '2305843010022720311'
                    name: My Favorite portal
                    url: myportal
                  - id: '2305843010022720322'
                    name: Secret portal
                    url: secretportal
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching feedback portals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of your account’s feedback portals
      tags:
      - Feedback Portals
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - description: Filter by single portal
        in: query
        name: portalId
        required: false
        schema:
          type: string
  /feedback_portal/{portalId}/categories:
    get:
      operationId: GetCategories
      responses:
        '200':
          description: A list of categories in a feedback portal
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FeedbackPortal'
                type: array
              examples:
                Example 1:
                  value:
                  - id: '2305843010122720311'
                    name: General
                  - id: '2305843010222720322'
                    name: My favorite category
        '400':
          description: Invalid portal ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching categories in a feedback portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of the feedback portal categories
      tags:
      - Feedback Portals
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - in: path
        name: portalId
        required: true
        schema:
          type: string
      - in: query
        name: workspaceId
        required: false
        schema:
          default: ''
          type: string
  /feedback_portal/{portalId}/importances:
    get:
      operationId: GetImportances
      responses:
        '200':
          description: A list of importances in a feedback portal
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PortalImportance'
                type: array
              examples:
                Example 1:
                  value:
                  - id: '2305843010122720555'
                    name: Critical
                    isDefault: false
                  - id: '2305843010122720556'
                    name: Nice to Have
                    isDefault: true
        '400':
          description: Invalid portal ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching importances in a feedback
            portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of the feedback portal importances.
      tags:
      - Feedback Portals
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - in: path
        name: portalId
        required: true
        schema:
          type: string
  /feedback_portal/{portalId}/feedback_items:
    get:
      operationId: GetIdeas
      responses:
        '200':
          description: A list of items in a feedback portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackItemsPaginated_FeedbackItem_'
              examples:
                Example 1:
                  value:
                  - id: '2305843010159177973'
                    portalId: '2305843009928936739'
                    shortId: DAR-6
                    title: '1'
                    description: qdw
                    category:
                      id: '2305843009943746454'
                      name: '1'
                    status:
                      id: '2305843009928936743'
                      name: New
                    internalStatus:
                      id: '2305843009943114957'
                      name: Not a Priority
                    importance:
                      id: '2305843009928936757'
                      name: Nice to Have
                    creationTime: '2022-06-16T17:06:30.000Z'
                    createdBy:
                      id: '2305843009550306942'
                      name: John Doe
                    owner:
                      id: '2305843009550306943'
                      name: Jane Doe
                    labels:
                    - Label 1
                    - Label 2
        '400':
          description: Invalid portal ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching ideas in a feedback portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of your feedback portal's items
      tags:
      - Feedback items
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - in: path
        name: portalId
        required: true
        schema:
          type: string
      - in: query
        name: workspaceId
        required: false
        schema:
          default: ''
          type: string
      - in: query
        name: page
        required: false
        schema:
          default: 1
          format: double
          type: number
      - in: query
        name: limit
        required: false
        schema:
          default: 25
          format: double
          type: number
      - description: Case-insensitive substring search over title + description. Min
          2 chars; shorter values are ignored.
        in: query
        name: keyword
        required: false
        schema:
          type: string
      - description: Exact match on textual short id (e.g. `CRK-3563`). When supplied,
          takes precedence over `keyword`.
        in: query
        name: shortId
        required: false
        schema:
          type: string
      - in: query
        name: fields
        required: false
        schema:
          type: string
      - description: Comma-separated numeric feedback IDs (e.g. `2305843…,2305843…`).
          Use when you already know which feedback items you need — e.g. the IDs returned
          by `get_item.feedbackLinks` — and want their metadata in one shot instead
          of paginating the portal.
        in: query
        name: ids
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      - in: query
        name: internalStatus
        required: false
        schema:
          type: string
      - in: query
        name: importance
        required: false
        schema:
          type: string
      - in: query
        name: category
        required: false
        schema:
          type: string
      - in: query
        name: company
        required: false
        schema:
          type: string
      - in: query
        name: labels
        required: false
        schema:
          type: string
      - in: query
        name: hasLinkedItems
        required: false
        schema:
          type: boolean
      - in: query
        name: postedBy
        required: false
        schema:
          type: string
      - in: query
        name: created_from
        required: false
        schema:
          format: date-time
          type: string
      - in: query
        name: created_to
        required: false
        schema:
          format: date-time
          type: string
  /feedback_item/{ideaId}:
    get:
      operationId: GetIdea
      responses:
        '200':
          description: Get a feedback item by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackItem'
              examples:
                Example 1:
                  value:
                  - id: '2305843010159177973'
                    portalId: '2305843009928936739'
                    shortId: DAR-6
                    title: '1'
                    description: qdw
                    category:
                      id: '2305843009943746454'
                      name: '1'
                    status:
                      id: '2305843009928936743'
                      name: New
                    internalStatus:
                      id: '2305843009943114957'
                      name: Not a Priority
                    importance:
                      id: '2305843009928936757'
                      name: Nice to Have
                    creationTime: '2022-06-16T17:06:30.000Z'
                    createdBy:
                      id: '2305843009550306942'
                      name: John Doe
                    owner:
                      id: '2305843009550306943'
                      name: Jane Doe
                    labels:
                    - Label 1
                    - Label 2
        '400':
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '404':
          description: No idea found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching ideas in a feedback portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get a feedback item by id
      tags:
      - Feedback items
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - in: path
        name: ideaId
        required: true
        schema:
          type: string
  /feedback_portal/{portalId}/plain_feedback:
    post:
      operationId: PostPlainIdea
      responses:
        '200':
          description: Create a plain feedback
          content:
            application/json:
              schema:
                type: string
              examples:
                Example 1:
                  value:
                    id: '2305456780315711635'
                    shortId: AAR-15
                    link: https://portal.ideas-test.craft.io/DAR-15
        '400':
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while creating a plain feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Create new plain feedbacks and submit to the desired feedback portal
        for further evaluation
      tags:
      - Feedback items
      security:
      - api_key:
        - write:feedback:craft
      parameters:
      - in: path
        name: portalId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlainIdeaRequest'
  /feedback_portal/{portalId}/feedback:
    post:
      operationId: PostIdea
      responses:
        '200':
          description: Create a plain feedback
          content:
            application/json:
              schema:
                type: string
              examples:
                Example 1:
                  value:
                    id: '2305456780315711635'
                    shortId: AAR-15
                    link: https://portal.ideas-test.craft.io/DAR-15
        '400':
          description: Invalid item ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while creating a plain feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Create a new feedback and submit to the desired feedback portal
        for further evaluation
      tags:
      - Feedback items
      security:
      - api_key:
        - write:feedback:craft
      parameters:
      - in: path
        name: portalId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeaRequest'
  /feedback_portal/{portalId}/custom_fields:
    get:
      operationId: GetCustomFields
      responses:
        '200':
          description: A list of feedback portal custom fields and their metadata
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CustomField'
                type: array
        '400':
          description: Invalid portal ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching custom fields in a feedback
            portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of your feedback portal's custom fields
      tags:
      - Feedback Portals
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - in: path
        name: portalId
        required: true
        schema:
          type: string
      - in: query
        name: includeOptions
        required: false
        schema:
          default: false
          type: boolean
  /feedback_portal/{portalId}/forms:
    get:
      operationId: GetForms
      responses:
        '200':
          description: A list of feedback portal forms and their metadata
          content:
            application/json:
              schema:
                properties:
                  forms:
                    items:
                      $ref: '#/components/schemas/PortalForm'
                    type: array
                  metadata:
                    properties:
                      count:
                        type: number
                        format: double
                      portalId:
                        type: string
                    required:
                    - count
                    - portalId
                    type: object
                required:
                - forms
                - metadata
                type: object
        '400':
          description: Invalid portal ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '401':
          description: No access to account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
        '500':
          description: An error occurred while fetching forms in a feedback portal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralErrorResponse'
      description: Get the list of your feedback portal's forms
      tags:
      - Feedback Portals
      security:
      - api_key:
        - read:feedback:craft
      parameters:
      - in: path
        name: portalId
        required: true
        schema:
          type: string
      - description: Filter by category
        in: query
        name: categoryId
        required: false
        schema:
          type: string
      - in: query
        name: includeOptions
        required: false
        schema:
          default: false
          type: boolean
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    Workspace:
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        key:
          type: string
        webUrl:
          type: string
          description: Canonical Craft.io app URL for this workspace. Computed in
            PublishService.
      type: object
      additionalProperties: false
    GeneralErrorResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
      additionalProperties: false
    CustomFieldOption:
      properties:
        id:
          type: string
        label:
          type: string
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
      required:
      - id
      - label
      type: object
      additionalProperties: false
    OptionShape:
      type: string
      enum:
      - select
      - date
      - date_range
    CustomField:
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        values:
          items:
            type: string
          type: array
        options:
          items:
            $ref: '#/components/schemas/CustomFieldOption'
          type: array
        optionShape:
          $ref: '#/components/schemas/OptionShape'
      required:
      - id
      - name
      - type
      type: object
      additionalProperties: false
    Terminology:
      properties:
        category:
          type: string
        default:
          type: string
        customSingle:
          type: string
        customPlural:
          type: string
      required:
      - category
      - default
      - customSingle
      type: object
      additionalProperties: false
    TerminologyList_Terminology_:
      properties: {}
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Terminology'
    Portfolio:
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        workspaces:
          items:
            $ref: '#/components/schemas/Workspace'
          type: array
        webUrl:
          type: string
          description: Canonical Craft.io app URL for this portfolio. Computed in
            PublishService.
      required:
      - workspaces
      type: object
      additionalProperties: false
    SlackConnection:
      properties:
        workspaceId:
          type: string
        token:
          type: string
        slackTeamId:
          type: string
        slackInstallation:
          type: string
        isActive:
          type: boolean
      type: object
      additionalProperties: false
    SlackPortal:
      properties:
        workspaceId:
          type: string
        portalId:
          type: string
        portalName:
          type: string
        token:
          type: string
      type: object
      additionalProperties: false
    TeamInfo:
      properties:
        installation:
          $ref: '#/components/schemas/SlackConnection'
        portalList:
          items:
            $ref: '#/components/schemas/SlackPortal'
          type: array
      required:
      - installation
      - portalList
      type: object
      additionalProperties: false
    SlackTeamInfo:
      $ref: '#/components/schemas/TeamInfo'
    ConnectionUpdateRequest:
      properties:
        slackTeamId:
          type: string
        slackTeamName:
          type: string
        slackEnterpriseId:
          type: string
        slackEnterpriseName:
          type: string
        slackInstallation:
          type: string
      required:
      - slackInstallation
      type: object
      additionalProperties: false
    ApiKeyIntrospection:
      description: 'Introspection endpoints for "what is the current API key allowed
        to do".

        Used by clients (notably the MCP server) to self-filter the tools they expose.'
      properties:
        userId:
          type: string
          description: The user this key authenticates as.
        accountId:
          type: string
          description: The account this key belongs to.
        scopes:
          items:
            type: string
          type: array
          description: Granted granular scope strings (already normalized).
        resourceScope:
          properties:
            feedback_portals:
              items:
                type: string
              type: array
              nullable: true
            portfolios:
              items:
                type: string
              type: array
              nullable: true
            workspaces:
              items:
                type: string
              type: array
              nullable: true
          type: object
          description: 'Optional resource-scope narrowing. When a dimension is null/missing
            the key

            has access to every instance the bound user can see; when present it is
            the

            exclusive allowlist of ids on that dimension.'
        mcpAccess:
          type: boolean
      required:
      - userId
      - accountId
      - scopes
      - resourceScope
      - mcpAccess
      type: object
      additionalProperties: false
    Entity:
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
      type: object
      additionalProperties: false
    NullableType_Entity_:
      allOf:
      - $ref: '#/components/schemas/Entity'
      nullable: true
    NullableType_Entity-Array_:
      items:
        $ref: '#/components/schemas/Entity'
      type: array
      nullable: true
    Persona:
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        position:
          type: string
      required:
      - position
      type: object
      additionalProperties: false
    NullableType_Persona_:
      allOf:
      - $ref: '#/components/schemas/Persona'
      nullable: true
    NullableType_Persona-Array_:
      items:
        $ref: '#/components/schemas/Persona'
      type: array
      nullable: true
    EntityWithDates:
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
      type: object
      additionalProperties: false
    NullableType_EntityWithDates_:
      allOf:
      - $ref: '#/components/schemas/EntityWithDates'
      nullable: true
    EntityWithTerminology:
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        customTermName:
          type: string
      type: object
      additionalProperties: false
    NullableType_EntityWithTerminology-and-EntityWithDates_:
      allOf:
      - $ref: '#/components/schemas/EntityWithTerminology'
      - $ref: '#/components/schemas/EntityWithDates'
      nullable: true
    Assignee:
      properties:
        id:
          type: string
        team:
          type: string
        user:
          type: string
      required:
      - id
      - team
      type: object
      additionalProperties: false
    NullableType_Assignee_:
      allOf:
      - $ref: '#/components/schemas/Assignee'
      nullable: true
    EntityParent:
      properties:
        id:
          type: string
        title:
          type: string
        shortId:
          type: string
        webUrl:
          type: string
          description: Direct link to the parent item in the Craft.io app.
      required:
      - id
