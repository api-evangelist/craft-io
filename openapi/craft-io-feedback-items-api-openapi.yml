      type: object
      additionalProperties: false
    BulkFeedbackUpdateRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BulkFeedbackUpdateItem'
          type: array
        options:
          $ref: '#/components/schemas/BulkWriteOptions'
      required:
      - items
      type: object
      additionalProperties: false
    ValidateErrorJSON:
      properties:
        message:
          type: string
        details:
          properties: {}
          additionalProperties: {}
          type: object
      required:
      - message
      - details
      type: object
      additionalProperties: false
    CustomFieldValue:
      properties:
        id:
          type: string
        name:
          type: string
        value:
          $ref: '#/components/schemas/NullableType_string-or-number_'
