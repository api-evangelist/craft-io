      - connectedItemIds
      - disconnected
      - notFound
      type: object
      additionalProperties: false
    BaseFeedbackItem:
      properties:
        id:
          type: string
        portalId:
          type: string
        shortId:
          type: string
        title:
          type: string
        description:
