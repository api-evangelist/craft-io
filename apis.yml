apis:
  - name: Craft.io Workspace API
    description: REST API providing access to workspace data including work items,
      custom fields, terminology, initiatives, products, epics, features, and stories
      within Craft.io product workspaces.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://help.craft.io/en/articles/8385550-craft-io-public-apis-for-workspace-portfolio-and-feedback-portal
    baseURL: https://api.craft.io
    tags:
