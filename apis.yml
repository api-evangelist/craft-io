name: Craft.io
description: Craft.io is a product management platform with a REST API for managing
  product backlog, specifications, OKRs, roadmaps, and customer feedback across product
  teams. The public API provides enterprise customers programmatic access to workspace,
  portfolio, and feedback portal data, enabling integration with BI tools and organizational
  communication channels.
